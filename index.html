<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウラ読み商談</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#D3D8D3; --sheet:#F4F5F1; --sheet-ink:#1D252A; --sheet-muted:#5B6762; --sheet-line:#CBD1CA;
  --box:#111922; --box-2:#1A2530; --box-ink:#EEF2F4; --box-line:#33424F;
  --amber:#F2C14E; --good:#2BA394; --bad:#D9483B; --heart:#E5484D; --inner:#A9D2F2;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--page);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#07090B; --sheet:#161D21; --sheet-ink:#E3E8E5; --sheet-muted:#95A19B; --sheet-line:#2D373B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#07090B; --sheet:#161D21; --sheet-ink:#E3E8E5; --sheet-muted:#95A19B; --sheet-line:#2D373B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--page);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none !important}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#0B1014;overflow:hidden;color:var(--box-ink)}

/* ---------- HUD ---------- */
.hud{grid-row:1;position:relative;z-index:3;background:#0D1319;border-bottom:1px solid #24303A;padding:.5rem .75rem .6rem;display:grid;gap:.45rem}
.hud-row{display:flex;align-items:center;gap:.55rem}
.hud-lab{font-size:.6875rem;color:#9FB0BC;font-weight:700;white-space:nowrap;min-width:2.9em}
.hearts{display:flex;gap:3px}
.hearts svg{width:18px;height:17px;fill:var(--heart);stroke:#0D1319;stroke-width:1.5;transition:fill .3s}
.hearts svg.lost{fill:transparent;stroke:#56636D}
.hearts svg.breaking{animation:heartbreak .7s}
@keyframes heartbreak{0%{transform:scale(1)}25%{transform:scale(1.5) rotate(-12deg)}55%{transform:scale(.7) rotate(8deg)}100%{transform:scale(1)}}
.hud-clock{display:flex;align-items:baseline;gap:.35rem;white-space:nowrap;padding-left:.35rem;border-left:1px solid #2A3641}
.hud-clock b{font-variant-numeric:tabular-nums;font-size:1rem}
.hud-clock span{font-size:.6875rem;color:#9FB0BC}
.hud-clock.over b,.hud-clock.over span{color:#FF8F7E}
.hud-btns{display:flex;gap:.3rem;margin-left:auto}
.hbtn{font-size:.75rem;border:1px solid #33424F;background:#16202A;border-radius:999px;padding:.2rem .6rem;line-height:1.5;white-space:nowrap}
.hbtn b{color:var(--amber);font-variant-numeric:tabular-nums}
.hbtn.pulse{animation:hpulse .9s 2}
@keyframes hpulse{50%{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,193,78,.35)}}
.hbtn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.wall-bar{flex:1;position:relative;height:11px;background:#222C35;border-radius:2px}
.wall-bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#0D1319 calc(10% - 2px) 10%);pointer-events:none}
.wall-fill{height:100%;width:100%;background:linear-gradient(#C9D0D6,#8C969F);border-radius:2px;transition:width .8s cubic-bezier(.2,.8,.2,1),background .4s}
.wall-fill.thin{background:linear-gradient(#F6D27A,#C98F2A)}
.wall-num{font-variant-numeric:tabular-nums;font-size:.8125rem;font-weight:700;text-align:right;min-width:1.8em}
.wall-dmg{position:absolute;right:-.2rem;top:-1.3rem;font-weight:700;font-size:.9rem;color:var(--amber);opacity:0;pointer-events:none}
.wall-dmg.up{color:var(--bad)}
.wall-dmg.pop{animation:dmg 1.1s ease-out}
@keyframes dmg{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}

/* ---------- 舞台 ---------- */
.stage{grid-row:2;position:relative;overflow:hidden;background:#3A2A20;min-height:0}
.stage[data-bg="gate"],.stage[data-bg="dusk"]{background:#22262A}
.stage[data-bg="office"]{background:#8E806C}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-8px,3px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-5px,2px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
.stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 36%,transparent 55%,rgba(0,0,0,.38))}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.flash.on{animation:flash .4s ease-out}
.flash.red{background:#D9483B}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.stage.danger::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 70px rgba(217,72,59,.65);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

#cam{transform-box:view-box;transform-origin:181px 132px;transition:transform .35s ease}
#scene.closeup #cam{transform:scale(1.6)}
#upper{transform-box:view-box;transform-origin:181px 400px;transition:transform .2s}
#scene[data-pose="slam"] #upper{transform:translateY(7px) scale(1.04)}
#head{transform-box:view-box;transform-origin:181px 215px;transition:transform .35s ease}
#rushbg{display:none}
#scene.rush #rushbg{display:inline}
#rays{transform-box:view-box;transform-origin:181px 140px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.glintfx{opacity:0}
#scene.glinting .glintfx{animation:glint .9s ease}
@keyframes glint{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#scene:not([data-bg="room"]) #room,#scene:not([data-bg="room"]) #table{display:none}
#scene:not([data-bg="gate"]):not([data-bg="dusk"]) #gate{display:none}
#scene:not([data-bg="office"]) #office{display:none}
#scene:not(.phone) .phone-only,#scene.phone .visit-only{display:none}
#scene:not([data-bg="dusk"]) .sky-dusk{display:none}
#scene[data-bg="dusk"] .sky-day{display:none}
#scene.nochar #chr,#scene.nochar #arms{display:none}
#scene.enter #chr,#scene.enter #arms{animation:enter .7s ease both}
@keyframes enter{from{opacity:0}to{opacity:1}}
.cup{transform-box:fill-box;transform-origin:50% 100%}
.cup.jolt{animation:jolt .45s}
@keyframes jolt{30%{transform:translateY(-7px) rotate(-7deg)}60%{transform:translateY(0) rotate(4deg)}}

/* カットイン */
.cutin{position:absolute;inset:0;z-index:4;display:flex;align-items:center;background:rgba(4,7,9,.42);cursor:pointer}
.ci-band{width:100%;padding:.95rem 1.3rem 1rem;transform:skewY(-5deg);background:linear-gradient(100deg,#0B4A43,#17897C);box-shadow:0 0 0 3px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.4);animation:slidein .38s cubic-bezier(.2,.9,.2,1)}
.ci-band>*{transform:skewY(5deg)}
.cutin[data-kind="bad"] .ci-band{background:linear-gradient(100deg,#5E120E,#C0392B)}
.cutin[data-kind="neutral"] .ci-band{background:linear-gradient(100deg,#27323B,#556470)}
@keyframes slidein{from{transform:skewY(-5deg) translateX(-110%)}to{transform:skewY(-5deg) translateX(0)}}
.ci-kick{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.18em;color:#FFE7A0}
.ci-name{margin:.1rem 0 .3rem;font-family:var(--serif);font-weight:800;font-size:1.55rem;color:#fff;letter-spacing:.05em;line-height:1.3}
.ci-desc p{margin:.25rem 0 0;font-size:.875rem;line-height:1.65;color:#F3F7F8}
.ci-desc b{color:#FFE7A0}
.ci-hint{margin:.45rem 0 0;font-size:.6875rem;color:rgba(255,255,255,.7);text-align:right}

/* バナー */
.banner{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(5,8,11,.74);cursor:pointer;text-align:center;padding:1.5rem}
.bn-inner{padding:1rem 0;border-top:1px solid rgba(242,193,78,.6);border-bottom:1px solid rgba(242,193,78,.6);min-width:70%;animation:bnin .5s ease both}
@keyframes bnin{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
.bn-title{margin:0;font-family:var(--serif);font-weight:800;font-size:2.1rem;letter-spacing:.14em;color:#fff;line-height:1.3}
.bn-text{margin:.55rem 0 0;color:#E6ECEF;font-size:.9375rem}
.bn-hint{margin:1rem 0 0;font-size:.6875rem;color:rgba(255,255,255,.6)}
.banner[data-kind="mission"] .bn-title,.banner[data-kind="clear"] .bn-title{color:var(--amber)}
.banner[data-kind="rush"]{background:rgba(58,6,4,.8)}
.banner[data-kind="rush"] .bn-inner{border-color:rgba(255,120,100,.7)}
.banner[data-kind="rush"] .bn-title{color:#FF8F7E}
.banner[data-kind="break"] .bn-title{color:#9FE7DA}
.banner[data-kind="hold"] .bn-title{color:#B9C4CC}

/* トースト */
.toast{position:absolute;left:.7rem;right:.7rem;top:.7rem;z-index:4;background:rgba(13,19,25,.94);border:1px solid var(--amber);border-radius:6px;padding:.5rem .75rem;font-size:.8125rem;line-height:1.55;animation:toastin .3s ease both;pointer-events:none}
.toast b{color:var(--amber);margin-right:.5rem}
@keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- テキストボックス ---------- */
.dock{grid-row:3;position:relative;z-index:3}
.tbox{position:relative;background:var(--box);border-top:2px solid var(--box-line);padding:1.45rem 1.1rem 1.15rem;min-height:8.5rem;cursor:pointer;user-select:none;-webkit-user-select:none}
.plate{position:absolute;left:.85rem;top:-.95rem;padding:.12rem .85rem;font-weight:700;font-size:.875rem;letter-spacing:.06em;color:#fff;border-radius:3px;background:#555;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.ttext{margin:0;font-size:1rem;line-height:1.75;white-space:pre-wrap;min-height:3.5em}
.tbox[data-who="narr"] .ttext{color:#C5CFD7}
.tbox[data-who="inner"] .ttext{color:var(--inner)}
.tbox[data-who="sys"] .ttext{color:var(--amber);font-weight:700}
.next{position:absolute;right:1rem;bottom:.55rem;color:var(--amber);font-size:.75rem;animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

.cbox{background:var(--box);border-top:2px solid var(--amber);padding:.75rem .85rem .9rem}
.ctop{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.cprompt{margin:0;font-family:var(--serif);font-weight:800;font-size:1.0625rem;color:var(--amber);letter-spacing:.04em}
.obs-btn{margin-left:auto;font-size:.75rem;border:1px solid #4A5A68;background:transparent;color:#CFE2EE;border-radius:999px;padding:.2rem .7rem;white-space:nowrap}
.obs{margin:0 0 .6rem;font-size:.8125rem;line-height:1.6;color:var(--inner);border-left:3px solid #5E9BC8;padding:.15rem 0 .15rem .6rem}
.timer{display:flex;align-items:center;gap:.6rem;margin:.1rem 0 .5rem}
.tbar{flex:1;position:relative;height:6px;background:#25313B;border-radius:3px;overflow:hidden}
.tbar span{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:3px}
.timer.low .tbar span{background:var(--bad)}
.timer b{font-size:.8125rem;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right}
.timer.low b{color:#FF8F7E}
.opt{display:block;width:100%;text-align:left;background:var(--box-2);color:var(--box-ink);border:1px solid #384856;border-radius:6px;padding:.62rem .85rem;margin-top:.45rem;font-size:.9375rem;line-height:1.55}
.opt:hover{border-color:var(--amber);background:#213040}
.badge{display:inline-block;font-size:.6875rem;font-weight:700;background:var(--amber);color:#1C1400;border-radius:3px;padding:0 .4rem;margin-right:.45rem;vertical-align:.1em}

/* ---------- タイトル / 結果 ---------- */
.screen-over{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;padding:1.5rem 1.25rem 1.5rem;overflow:auto}
.title-screen{background:linear-gradient(to bottom,rgba(7,11,15,.9) 0%,rgba(7,11,15,.35) 30%,rgba(7,11,15,.2) 45%,rgba(7,11,15,.94) 72%)}
.logo{margin:1.25rem 0 0;font-family:var(--serif);font-weight:800;font-size:clamp(2.6rem,12vw,3.4rem);letter-spacing:.1em;line-height:1.15;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.tagline{margin:.5rem 0 0;color:var(--amber);font-weight:700;letter-spacing:.12em;font-size:.9375rem}
.menu{margin-top:auto;display:grid;gap:.55rem}
.mbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.2rem .8rem;text-align:left;background:rgba(17,25,34,.92);border:1px solid #384856;border-radius:8px;padding:.8rem 1rem}
.mbtn .ep{font-size:.75rem;color:#9FB0BC;font-weight:700}
.mbtn .nm{font-family:var(--serif);font-weight:800;font-size:1.125rem}
.mbtn .st{font-size:.75rem;color:var(--amber);font-weight:700}
.mbtn.primary{border-color:var(--amber);background:rgba(36,30,12,.92)}
.mbtn:disabled{opacity:.5;cursor:not-allowed}
.subrow{display:flex;gap:.5rem}
.subrow .hbtn{flex:1;padding:.55rem .8rem;font-size:.8125rem;border-radius:6px}
.endscreen{background:rgba(7,11,15,.94);align-items:stretch}
.es-chap{margin:.5rem 0 0;font-size:.8125rem;color:#9FB0BC;font-weight:700}
.es-rankrow{display:flex;align-items:flex-end;gap:1rem;margin:.75rem 0 .25rem}
.es-rank{font-family:var(--serif);font-weight:800;font-size:5.5rem;line-height:.9;color:var(--amber)}
.es-rank.r-C{color:#B9C4CC}
.es-result{margin:0 0 .3rem;font-family:var(--serif);font-weight:800;font-size:1.5rem}
.es-over{margin:2rem 0 .5rem;font-family:var(--serif);font-weight:800;font-size:clamp(2rem,10vw,2.6rem);letter-spacing:.12em;color:#FF7A6A}
.es-sub{margin:0;color:#C5CFD7;font-size:.9375rem;line-height:1.7}
.es-stats{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid #26323C}
.es-stats li{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #26323C;font-size:.9375rem}
.es-stats li span:first-child{color:#9FB0BC}
.es-h{margin:1.25rem 0 .45rem;font-size:.8125rem;color:#9FB0BC}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-size:.8125rem;padding:.2rem .6rem;border-radius:4px;border:1px solid #2BA394;color:#7FE0D2}
.chip.ng{border-color:#C0392B;color:#FF9C8F}
.advice{margin:1.25rem 0 0;background:#151F28;border-left:3px solid var(--amber);border-radius:4px;padding:.8rem .9rem}
.advice b{display:block;font-size:.8125rem;color:var(--amber);margin-bottom:.25rem}
.advice p{margin:0;font-size:.9375rem;line-height:1.7}
.es-note{margin:1rem 0 0;font-size:.8125rem;color:#9FB0BC;line-height:1.6}
.es-actions{margin-top:auto;padding-top:1.5rem;display:grid;gap:.5rem}
.abtn{border-radius:6px;padding:.8rem 1rem;font-weight:700;border:1px solid #384856;background:#16202A}
.abtn.primary{background:var(--amber);border-color:var(--amber);color:#1C1400}

/* ---------- シート ---------- */
.overlay{position:absolute;inset:0;z-index:10;background:rgba(3,6,8,.6);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86%;overflow:auto;background:var(--sheet);color:var(--sheet-ink);border-radius:12px 12px 0 0;padding:0 1.15rem 1.5rem}
.sheet header{position:sticky;top:0;background:var(--sheet);display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0 .6rem;border-bottom:1px solid var(--sheet-line)}
.sheet h2{margin:0;font-family:var(--serif);font-weight:800;font-size:1.25rem}
.sheet .close{border:1px solid var(--sheet-line);background:transparent;border-radius:999px;padding:.2rem .8rem;font-size:.8125rem}
.sheet h3{margin:1.2rem 0 .3rem;font-size:.8125rem;color:var(--sheet-muted)}
.card{padding:.75rem 0;border-bottom:1px dashed var(--sheet-line)}
.card h4{margin:0 0 .2rem;font-family:var(--serif);font-weight:800;font-size:1.0625rem}
.card p{margin:.2rem 0 0;font-size:.875rem;line-height:1.7}
.card .tip{color:var(--sheet-muted)}
.card.locked h4{color:var(--sheet-muted);letter-spacing:.3em}
.card.ng h4{color:#B83A2E}
.sheet .lead{margin:.8rem 0 0;font-size:.8125rem;color:var(--sheet-muted);line-height:1.6}

@media (prefers-reduced-motion: reduce){
  .stage.shake,#rays,.hearts svg.breaking,.next,.cup.jolt,.stage.danger::after,.hbtn.pulse{animation:none !important}
  #cam,#head,#upper{transition:none !important}
  #scene.closeup #cam{transform:none}
  .ci-band,.bn-inner,.toast,#scene.enter #chr,#scene.enter #arms{animation:none !important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="hud" id="hud" hidden>
    <div class="hud-row">
      <span class="hud-lab">信頼</span>
      <span class="hearts" id="hearts" role="img" aria-label="信頼 5/5"></span>
      <div class="hud-btns">
        <button class="hbtn" type="button" id="noteBtn">手帳 <b id="noteCount">0</b></button>
        <button class="hbtn" type="button" id="dexBtn">図鑑</button>
        <button class="hbtn" type="button" id="sndBtn" aria-pressed="false">♪ オフ</button>
      </div>
    </div>
    <div class="hud-row">
      <span class="hud-lab">心の壁</span>
      <div class="wall-bar"><div class="wall-fill" id="wallFill"></div><span class="wall-dmg" id="wallDmg"></span></div>
      <span class="wall-num" id="wallNum">100</span>
      <div class="hud-clock"><b id="hudTime">0:00</b><span id="hudLeft">通話前</span></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 360 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="居間で向かい合う高橋さん" data-bg="room" data-pose="crossed" class="nochar">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7C9DE"/><stop offset="1" stop-color="#E6EEF0"/></linearGradient>
        <linearGradient id="gSky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FBBD8"/><stop offset=".7" stop-color="#DCE9EF"/></linearGradient>
        <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E436F"/><stop offset=".45" stop-color="#D9805A"/><stop offset=".75" stop-color="#F3C487"/></linearGradient>
        <linearGradient id="gTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70523F"/><stop offset="1" stop-color="#3A2A20"/></linearGradient>
        <linearGradient id="gShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121A28" stop-opacity=".8"/><stop offset=".85" stop-color="#121A28" stop-opacity="0"/></linearGradient>
        <radialGradient id="gVig" cx=".5" cy=".38" r=".8"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></radialGradient>
        <clipPath id="cFace"><path d="M128 122 C127 76 150 52 181 52 C213 52 235 76 234 122 C234 152 228 178 215 197 C204 213 193 222 181 222 C169 222 158 213 147 197 C134 178 128 152 128 122 Z"/></clipPath>
      </defs>
      <g id="cam">
        <!-- 高橋さんの実家の居間 -->
        <g id="room">
          <rect x="-200" y="-300" width="760" height="546" fill="#D3C9B6"/>
          <rect x="-200" y="-22" width="760" height="6" fill="#A8987E"/>
          <rect x="-200" y="246" width="760" height="200" fill="#A99A80"/>
          <rect x="-200" y="243" width="760" height="5" fill="#7E6E57"/>
          <g transform="translate(12 30)">
            <rect width="116" height="160" fill="#F1ECE0" stroke="#7A6A55" stroke-width="2"/>
            <rect x="7" y="7" width="102" height="146" fill="url(#gSky)"/>
            <path d="M7 112 L30 94 L52 106 L78 88 L109 106 L109 153 L7 153 Z" fill="#9BB2A8"/>
            <path d="M14 121 L36 105 L58 121 Z" fill="#5E6670"/>
            <rect x="18" y="121" width="36" height="22" fill="#E3DDD0"/>

let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { AC = null; } } return AC; }
function tone(f, dur, type = "square", vol = .05, slide){
  if (!soundOn) return; const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .25){
  if (!soundOn) return; const c = ac(); if (!c) return;
  const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 900; s.buffer = buf; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}

function callText(s){ return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function renderHud(){
  const hs = [...$("#hearts").children];
  hs.forEach((h, i) => h.classList.toggle("lost", i >= G.trust));
  $("#hearts").setAttribute("aria-label", `信頼 ${G.trust}/5`);
  $("#wallFill").style.width = G.wall + "%";
  $("#wallFill").classList.toggle("thin", G.wall <= 30);
  $("#wallNum").textContent = G.wall;
  $("#noteCount").textContent = G.notes.length;
  $("#hudTime").textContent = callText(G.seconds);
  const over = !!CH.limit && G.seconds > CH.limit;
  $("#hudLeft").textContent = CH.limit ? (over ? "約束を超過" : `／約束${CH.limit / 60}分`) : cur.phone ? "通話中" : G.seconds ? "通話終了" : "通話前";
  $(".hud-clock").classList.toggle("over", over);
  $("#mHand").setAttribute("transform", `rotate(${G.seconds / 10})`);
  $("#hHand").setAttribute("transform", `rotate(${(CH.clockHour % 12) * 30 + G.seconds / 120})`);
  stage.classList.toggle("danger", cur.hud && G.trust <= 2 && G.trust > 0);
}
function changeTrust(d){
  const before = G.trust;
  G.trust = clamp(before + d, 0, 5);
  renderHud();
  if (G.trust < before) {
    const hs = [...$("#hearts").children];
    for (let i = G.trust; i < before; i++) retrigger(hs[i], "breaking");
    flashEl.classList.add("red"); retrigger(flashEl, "on");
    if (!reduceMotion) retrigger(stage, "shake");
    SFX.bad();
  }
}
function changeWall(d){
  const before = G.wall;
  G.wall = clamp(before + d, 0, 100);
  renderHud();
  const dm = $("#wallDmg");
  const real = G.wall - before;
  if (real) {
    dm.textContent = (real > 0 ? "+" : "−") + Math.abs(real);
    dm.classList.toggle("up", real > 0);
    retrigger(dm, "pop");
  }
  if (G.wall === 0 && !G.broken) {
    G.broken = true;
    const i = Q.findIndex(c => c.t === "checkTrust");
    Q.splice(i < 0 ? 0 : i, 0, {t:"break"});
  }
}

  if (tapResolver && Date.now() >= tapReadyAt) { const r = tapResolver; tapResolver = null; r(); }
}
app.addEventListener("click", e => {
  if (e.target.closest("button, .hud, .cbox, .overlay, .screen-over")) return;
  advance();
});
document.addEventListener("keydown", e => {
  if (!overlay.hidden) { if (e.key === "Escape") closeSheet(); return; }
  if ((e.key === "Enter" || e.key === " ") && !e.target.closest("button")) { e.preventDefault(); advance(); }
});

/* ===================== 実行エンジン ===================== */
async function run(){
  const my = ++runToken;
  while (Q.length && my === runToken) {
    const c = Q.shift();
    await exec(c, my);
  }
}
function abortRun(){
  runToken++;
  typing = false; stopFlap();
  if (tapResolver) { const r = tapResolver; tapResolver = null; r(); }
  if (choiceAbort) choiceAbort();
  cutinEl.hidden = true; bannerEl.hidden = true;
}

async function exec(c, my){
  switch (c.t) {
    case "bg": setBg(c.v); break;
    case "char": setChar(c.v); if (c.face) setFace(c.face); if (c.pose) setPose(c.pose); break;
    case "hud": setHud(c.v); renderHud(); break;
    case "rush": setRush(c.v); break;
    case "phone": setPhone(c.v); if (c.sfx && SFX[c.sfx]) SFX[c.sfx](); renderHud(); break;
    case "say": await say(c, my); break;
    case "banner": await banner(c, my); break;
    case "note": addNote(c.id); break;
    case "cp": CP = {G: JSON.parse(JSON.stringify(G)), Q: Q.slice(), cur: {...cur}}; break;
    case "call": Q.unshift(...c.fn()); break;
    case "choice": {
      const o = await choice(c);
      if (my !== runToken || !o) return;
      Q.unshift(...expandOption(o));
      break;
    }
    case "effect": await effect(c.o, my); break;
    case "checkTrust": if (G.trust <= 0) Q = gameoverSeq(); break;
    case "break": await breakWall(my); break;
    case "end": Q = []; endGame(c.v); break;
  }
}

async function say(c, my){
  scene.classList.remove("closeup");
  if (c.face) setFace(c.face);
  if (c.pose) setPose(c.pose);
  if (c.fx) fx(c.fx);
  if (c.sfx && SFX[c.sfx]) SFX[c.sfx]();
  const who = c.who;
  const p = PLATES[who];
  plate.hidden = !p;
  if (p) { plate.textContent = p.name; plate.style.background = p.color; }
  tbox.dataset.who = who;
  const text = who === "inner" ? `（${c.text}）` : c.text;
  await typeText(text, who, my);
  if (my !== runToken) return;
  await waitTap();
}
async function typeText(text, who, my){
  ttext.textContent = ""; nextMark.hidden = true;
  typing = true; skipType = false;
  if (who === T && cur.char) startFlap();
  const speed = reduceMotion ? 8 : 26;
  for (let i = 1; i <= text.length; i++) {
    if (my !== runToken) { typing = false; stopFlap(); return; }
    if (skipType) { ttext.textContent = text; break; }
    ttext.textContent = text.slice(0, i);
    const ch = text[i - 1];
    if (i % 2 === 0 && !"…　 ".includes(ch)) SFX.blip(who);
    await wait("。！？".includes(ch) ? speed * 6 : "、…".includes(ch) ? speed * 2.5 : speed);
  }
  typing = false; stopFlap();
  nextMark.hidden = false;
}

async function banner(c, my){
  bannerEl.dataset.kind = c.kind;
  $("#bnTitle").textContent = c.title;
  $("#bnText").textContent = c.text || "";
  bannerEl.hidden = false; retrigger($(".bn-inner"), "x");
  if (c.kind === "rush") SFX.impact(); else if (c.kind === "clear") SFX.clear(); else SFX.good();
  await waitTap(500);
  if (my !== runToken) return;
  bannerEl.hidden = true;
}

function addNote(id){
  if (!CH.notes[id] || G.notes.includes(id)) return;
  G.notes.push(id);
  renderHud();
  toast("手帳にメモ", CH.notes[id]);
  retrigger($("#noteBtn"), "pulse");
}

async function cutin(kind, techs, my){
  cutinEl.dataset.kind = kind;
  $("#ciKick").textContent = kind === "bad" ? "NG行動" : kind === "neutral" ? "テクニック発動（効果は小さい）" : "テクニック発動";
  $("#ciName").textContent = techs.map(id => DEX[id].name).join("＋");
  const d = $("#ciDesc"); d.innerHTML = "";
  techs.forEach(id => {
    const p = el("p");
    if (techs.length > 1) p.append(el("b", null, DEX[id].name + "　"));
    p.append(document.createTextNode(DEX[id].desc));
    d.append(p);
  });
  cutinEl.hidden = false; retrigger($(".ci-band"), "x");
  await waitTap(500);
  if (my !== runToken) return;
  cutinEl.hidden = true;
}

async function breakWall(my){
  fx(["flash"]); if (!reduceMotion) retrigger(stage, "shake");
  SFX.brk();
  setFace("shock");
  await banner({kind:"break", title:"心の壁が崩れた！", text:"高橋さんが、本気で話を聞き始めた"}, my);
}

/* ===================== 選択肢 ===================== */
let timerInt = null;
function stopTimer(){ if (timerInt) { clearInterval(timerInt); timerInt = null; } $("#timer").hidden = true; }
function choice(c){
  return new Promise(resolve => {
    tbox.hidden = true; cbox.hidden = false;
    $("#cprompt").textContent = c.prompt;
    const obsBtn = $("#obsBtn"), obsText = $("#obsText");
    obsText.hidden = true; obsBtn.hidden = !c.observe;
    obsBtn.textContent = cur.phone ? "声を聴く" : "表情を観察する";
    obsBtn.onclick = () => {
      obsBtn.hidden = true; obsText.hidden = false; obsText.textContent = c.observe;
      scene.classList.add("closeup");
      setTimeout(() => scene.classList.remove("closeup"), 1500);
      const key = cur.phone ? "voice" : "nonverbal";
      if (DEX[key] && !unlocked.has(key)) { unlock([key]); toast("図鑑に追加", DEX[key].name); }
    };
    const opts = $("#opts"); opts.innerHTML = "";
    let done = false;
    const finish = o => {
      if (done) return; done = true;
      stopTimer(); choiceAbort = null;
      cbox.hidden = true; tbox.hidden = false;
      resolve(o);
    };
    choiceAbort = () => finish(null);
    c.options.forEach(o => {
      const b = el("button", "opt"); b.type = "button";
      if (o.badge) b.append(el("span", "badge", o.badge));
      b.append(document.createTextNode(o.label));
      b.addEventListener("click", () => finish(o));
      opts.append(b);
    });
    if (c.timer) {
      const tEl = $("#timer"), fill = $("#timerFill"), num = $("#timerNum");
      tEl.hidden = false; tEl.classList.remove("low");
      let left = c.timer * 1000, lastSec = c.timer;
      fill.style.width = "100%"; num.textContent = c.timer + "秒";
      timerInt = setInterval(() => {
        if (!overlay.hidden) return;
        left -= 100;
        fill.style.width = Math.max(0, left / (c.timer * 1000) * 100) + "%";
        const sec = Math.ceil(left / 1000);
        if (sec !== lastSec) { lastSec = sec; num.textContent = sec + "秒"; if (sec <= 5 && sec > 0) { tEl.classList.add("low"); SFX.tick(); } }
        if (left <= 0) finish(c.timeout || CH.timeout);
      }, 100);
    } else stopTimer();
  });
}
function expandOption(o){
  const seq = [{t:"say", who:"you", text:o.line}];
  if (o.kind === "bad") seq.push(...(o.then || []), {t:"effect", o});
  else seq.push({t:"effect", o}, ...(o.then || []));
  if (o.after) seq.push(...o.after);
  if (o.final) seq.push({t:"call", fn: () => CH.finale(o.final)});
  seq.push({t:"checkTrust"});
  return seq;
}
async function effect(o, my){
  const techs = (o.tech || []).filter(id => DEX[id]);
  G.seconds += o.time != null ? o.time : CH.time + (o.kind === "bad" ? CH.badExtra : 0);
  if (o.qid) { G.asked.push(o.qid); G.qLeft--; }
  unlock(techs);
  if (o.kind === "bad") {
    techs.forEach(id => { if (!G.ng.includes(id)) G.ng.push(id); });
    if (techs[0]) G.lastNG = techs[0];
    renderHud();
    if (o.trust) changeTrust(o.trust);
    if (o.wall) changeWall(o.wall);
    if (techs.length) { await wait(350); if (my !== runToken) return; await cutin("bad", techs, my); }
  } else {
    techs.forEach(id => { if (!G.used.includes(id)) G.used.push(id); });
    renderHud();
    if (techs.length) { o.kind === "good" ? SFX.hit() : SFX.good(); await cutin(o.kind, techs, my); if (my !== runToken) return; }
    if (o.wall) { changeWall(o.wall); await wait(700); }
    if (o.trust) changeTrust(o.trust);
  }
}

function gameoverSeq(){
  return CH.gameover();
}

/* ===================== 開始・終了 ===================== */
function startGame(id){
  if (typeof id === "string" && CHAPTERS[id]) CH = CHAPTERS[id];
  abortRun();
  G = freshState(); Q = CH.script.slice(); CP = null;
  setRush(false); setHud(false); setPhone(false); setFace("stern"); setPose("crossed");
  titleScreen.hidden = true; endScreen.hidden = true; dock.hidden = false;
  tbox.hidden = false; cbox.hidden = true; toastEl.hidden = true;
  renderHud();
  run();
}
function retryFromCheckpoint(){
  if (!CP) return startGame();
  abortRun();
  G = JSON.parse(JSON.stringify(CP.G)); Q = CP.Q.slice();
  const c = CP.cur;
  setBg(c.bg); setChar(c.char); setPhone(c.phone); setFace(c.face); setPose(c.pose); setRush(c.rush); setHud(c.hud);
  endScreen.hidden = true; dock.hidden = false; tbox.hidden = false; cbox.hidden = true;
  ttext.textContent = ""; plate.hidden = true;
  renderHud();
  CP = {G: JSON.parse(JSON.stringify(G)), Q: Q.slice(), cur: {...c}};
  run();
}
function toTitle(){
  abortRun();
  setBg("room"); setChar(true); setPhone(true); setFace("stern"); setPose("crossed"); setRush(false); setHud(false);
  stage.classList.remove("danger");
  dock.hidden = true; endScreen.hidden = true; titleScreen.hidden = false;
  const ids = Object.keys(CHAPTERS);
  const next = ids.find(id => chapterOpen(id) && !cleared(id)) || ids[0];
  document.querySelectorAll("[data-ch]").forEach(b => {
    const c = CHAPTERS[b.dataset.ch], open = chapterOpen(c.id), best = store.get(c.bestKey, null);
    b.disabled = !open;
    b.classList.toggle("primary", c.id === next);
    b.querySelector(".st").textContent = !open ? `${CHAPTERS[c.requires].ep}クリアで解放` : best ? `ベスト ${best}` : "はじめる";
  });
}
/* 成功（S・A・B）で章クリア。次の章は前の章をクリアすると遊べる */
function cleared(id){ return ["S", "A", "B"].includes(store.get(CHAPTERS[id].bestKey, null)); }
function chapterOpen(id){ const r = CHAPTERS[id].requires; return !r || cleared(r); }

const RANK_ORDER = ["S", "A", "B", "C", "D"];
function endGame(v){
  setRush(false);
  stage.classList.remove("danger");
  endScreen.innerHTML = "";
  dock.hidden = true;
  if (v === "gameover" || v === "fail") {
    const ng = DEX[G.lastNG] || DEX.silence;
    endScreen.append(el("p", "es-chap", CH.title));
    endScreen.append(el("p", "es-over", CH.texts.over));
    endScreen.append(el("p", "es-sub", v === "gameover" ? CH.texts.overSub : CH.texts.failSub));
    const adv = el("div", "advice");
    adv.append(el("b", null, "鬼塚先輩"));
    adv.append(el("p", null, `「${ng.name}」はまずかったな。${ng.tip}`));
    endScreen.append(adv);
    const acts = el("div", "es-actions");
    acts.append(btn("直前の場面からやり直す", "abtn primary", retryFromCheckpoint), btn("最初からやり直す", "abtn", startGame), btn("タイトルへ", "abtn", toTitle));
    endScreen.append(acts);
  } else {
    const rank = v === "success" ? (G.trust >= 5 ? "S" : G.trust >= 3 ? "A" : "B") : "C";
    const best = store.get(CH.bestKey, null);
    if (!best || RANK_ORDER.indexOf(rank) < RANK_ORDER.indexOf(best)) store.set(CH.bestKey, rank);
    endScreen.append(el("p", "es-chap", CH.title));
    const row = el("div", "es-rankrow");
    row.append(el("span", "es-rank r-" + rank, rank));
    const col = el("div");
    col.append(el("p", "es-result", v === "success" ? "ミッション達成" : "保留"));
    col.append(el("p", "es-sub", v === "success" ? CH.texts.success : CH.texts.hold));
    row.append(col);
    endScreen.append(row);
    const ul = el("ul", "es-stats");
    const li = (a, b) => { const l = el("li"); l.append(el("span", null, a), el("span", null, b)); ul.append(l); };
    li("残った信頼", "♥".repeat(G.trust) + "♡".repeat(5 - G.trust));
    const total = Object.keys(CH.notes).length;
    li("手帳に集めた本音", `${G.notes.length}／${total}`);
    li(CH.texts.timeLabel, callText(G.seconds));
    endScreen.append(ul);
    if (G.used.length) {
      endScreen.append(el("p", "es-h", "使ったテクニック"));
      const ch = el("div", "chips"); G.used.forEach(id => ch.append(el("span", "chip", DEX[id].name))); endScreen.append(ch);
    }
    if (G.ng.length) {
      endScreen.append(el("p", "es-h", "やってしまったNG"));
      const ch = el("div", "chips"); G.ng.forEach(id => ch.append(el("span", "chip ng", DEX[id].name))); endScreen.append(ch);
    }
    endScreen.append(el("p", "es-note", G.notes.length < total ? CH.texts.note : "本音をすべて集めました。"));
    const acts = el("div", "es-actions");
    const next = v === "success" && CH.next && CHAPTERS[CH.next];
    if (next) acts.append(btn(`${next.ep}「${next.name}」へ進む`, "abtn primary", () => startGame(next.id)));
    acts.append(btn("もう一度プレイ", next ? "abtn" : "abtn primary", startGame), btn("テクニック図鑑を見る", "abtn", openDex), btn("タイトルへ", "abtn", toTitle));
    endScreen.append(acts);
  }
  endScreen.hidden = false;
  endScreen.scrollTop = 0;
}
function btn(label, cls, fn){ const b = el("button", cls, label); b.type = "button"; b.addEventListener("click", fn); return b; }

/* ===================== シート ===================== */
let lastFocus = null;
function openSheet(title, build){
  lastFocus = document.activeElement;
  $("#sheetTitle").textContent = title;
  const body = $("#sheetBody"); body.innerHTML = ""; build(body);
  overlay.hidden = false; $(".sheet").scrollTop = 0;
  $("#sheetClose").focus();
}
function closeSheet(){ overlay.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$("#sheetClose").addEventListener("click", closeSheet);
overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });

function openDex(){
  const ids = Object.keys(DEX);
  openSheet(`テクニック図鑑　${ids.filter(id => unlocked.has(id)).length}／${ids.length}`, body => {
    body.append(el("p", "lead", "商談で使ったり、やってしまったりすると記録されます。"));
    [["テクニック", true], ["NG集", false]].forEach(([h, good]) => {
      body.append(el("h3", null, h));
      ids.filter(id => DEX[id].good === good).forEach(id => {
        const d = DEX[id], open = unlocked.has(id);
        const c = el("article", "card" + (open ? "" : " locked") + (good ? "" : " ng"));
        if (open) { c.append(el("h4", null, d.name), el("p", null, d.desc), el("p", "tip", (good ? "コツ：" : "代わりに：") + d.tip)); }
        else { c.append(el("h4", null, "？？？"), el("p", "tip", "まだ出会っていない")); }
        body.append(c);
      });
    });
  });
}
function openNotes(){
  openSheet(`手帳　${G ? G.notes.length : 0}／${Object.keys(CH.notes).length}`, body => {
    body.append(el("p", "lead", "高橋さんから聞き出した本音です。選択肢に「手帳」と付いたものは、ここに書いた情報を使えます。"));
    Object.keys(CH.notes).forEach(id => {
      const got = G && G.notes.includes(id);
      const c = el("article", "card" + (got ? "" : " locked"));
      c.append(el("h4", null, got ? CH.notes[id] : "？？？"));
      body.append(c);
    });
  });
}
$("#noteBtn").addEventListener("click", openNotes);
$("#dexBtn").addEventListener("click", openDex);
$("#titleDex").addEventListener("click", openDex);

function syncSound(){
  $("#sndBtn").setAttribute("aria-pressed", String(soundOn));
  $("#sndBtn").textContent = soundOn ? "♪ オン" : "♪ オフ";
  $("#titleSnd").setAttribute("aria-pressed", String(soundOn));
  $("#titleSnd").textContent = soundOn ? "効果音 オン" : "効果音 オフ";
}
function toggleSound(){
  soundOn = !soundOn; store.set("urayomi2.sound", soundOn);
  if (soundOn) { const c = ac(); if (c && c.resume) c.resume(); SFX.good(); }
  syncSound();
}
$("#sndBtn").addEventListener("click", toggleSound);
$("#titleSnd").addEventListener("click", toggleSound);
document.querySelectorAll("[data-ch]").forEach(b => b.addEventListener("click", () => { const c = ac(); if (soundOn && c && c.resume) c.resume(); startGame(b.dataset.ch); }));

/* 舞台の比率に合わせてカメラを決める（顔が上から4割の位置に来るように） */
function fitScene(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  const vw = 330, vh = vw * h / w;
  const vy = clamp(136 - vh * .4, -300, 700 - vh);
  scene.setAttribute("viewBox", `16 ${vy.toFixed(1)} ${vw} ${vh.toFixed(1)}`);
}
if (window.ResizeObserver) new ResizeObserver(fitScene).observe(stage);
window.addEventListener("resize", fitScene);

/* ===================== 初期化 ===================== */
G = freshState();
syncSound();
setPose("crossed"); setFace("stern");
toTitle();
})();

</script>
